name: Publish FORM to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test && pnpm run test:dashboard && pnpm run test:cors && pnpm run test:muscles && pnpm run test:guides
      - name: Build GitHub Pages frontend
        run: |
          test -n "$VITE_API_ORIGIN" || { echo "Set repository variable VITE_API_ORIGIN first"; exit 1; }
          pnpm exec vite build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
